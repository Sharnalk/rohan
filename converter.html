<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rohan</title>
    <!-- Applies the saved theme before the first paint, so there is no flash of the wrong theme. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="M10 9H8" />
          <path d="M16 13H8" />
          <path d="M16 17H8" />
        </svg>
        <!-- Heaven's Door. -->
        <span class="brand-name">r<span class="brand-o">o<svg class="logo-hat" viewBox="0 0 24 16" aria-hidden="true">
              <!-- Line art in the text color: brim, crown, opening, then the lattice. -->
              <ellipse cx="12" cy="13" rx="11" ry="2.5" />
              <path d="M6 3 7 13M18 3l-1 10" />
              <ellipse cx="12" cy="3" rx="6" ry="1.6" />
              <path d="M10 4.6v8.9M14 4.6v8.9M6.5 8.2a5.6 1.4 0 0 0 11 0" />
            </svg></span>han</span>
        <span class="label">PDF → TXT / MD</span>
      </div>
      <button id="theme-toggle" class="button button-icon" type="button" aria-label="Switch to dark mode">
        <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      </button>
    </header>

    <main class="page">
      <div class="intro">
        <h1>Convert PDFs to text</h1>
        <p>The files are read in your browser. Nothing is sent over the internet.</p>
      </div>

      <input id="pdf-input" class="visually-hidden" type="file" accept="application/pdf" multiple />

      <label id="dropzone" class="dropzone" for="pdf-input">
        <svg class="icon" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="M12 12v6" />
          <path d="m15 15-3-3-3 3" />
        </svg>
        <span class="dropzone-title">Drop PDFs here</span>
        <span class="dropzone-or">or <span class="button button-secondary">Choose files</span></span>
        <span class="label">PDF ONLY</span>
      </label>

      <div id="status" class="status" role="status" aria-live="polite">
        <svg class="icon icon-loading" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <svg class="icon icon-done" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <svg class="icon icon-error" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4M12 16h.01" />
        </svg>
        <span id="status-text"></span>
      </div>

      <section id="files" class="card files" hidden>
        <div class="toolbar">
          <div class="toolbar-start">
            <input id="select-all" class="checkbox" type="checkbox" aria-label="Select all files" />
            <span id="files-meta" class="label"></span>
          </div>
          <div class="toolbar-end">
            <div class="segmented" role="group" aria-label="Output format">
              <button id="format-text" class="segment" type="button" aria-pressed="true">Text</button>
              <button id="format-markdown" class="segment" type="button" aria-pressed="false">Markdown</button>
            </div>
            <button id="copy-selected" class="button button-primary" type="button" disabled>
              <svg class="icon icon-copy" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="14" height="14" rx="2" />
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
              </svg>
              <svg class="icon icon-copied" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              <span>Copy selected</span>
            </button>
          </div>
        </div>
        <ul id="file-list" class="file-list"></ul>
      </section>

      <!-- One row per file, cloned by views.ts. Disabled until the file is converted. -->
      <template id="file-template">
        <li class="file-item">
          <input class="checkbox file-check" type="checkbox" aria-label="Select this file" disabled />
          <button class="file-open" type="button" title="Show in the preview" disabled>
            <span class="file-name"></span>
          </button>
          <span class="label file-meta"></span>
          <button class="button button-icon file-copy" type="button" title="Copy" disabled>
            <svg class="icon icon-copy" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="8" width="14" height="14" rx="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            <svg class="icon icon-copied" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
          <button class="button button-icon file-download" type="button" title="Download" disabled>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <path d="m7 10 5 5 5-5" />
              <path d="M12 15V3" />
            </svg>
          </button>
          <button class="button button-icon file-remove" type="button" title="Remove">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </li>
      </template>

      <section id="preview" class="card result" hidden>
        <div class="toolbar">
          <span id="preview-name" class="file-name"></span>
          <span id="preview-meta" class="label"></span>
        </div>
        <div class="result-body">
          <pre id="output" class="output"></pre>
        </div>
      </section>

      <footer class="footer label">
        v0.1.0 · WORKS OFFLINE ·
        <a class="footer-link" href="https://github.com/Sharnalk" target="_blank" rel="noopener noreferrer">MORE TOOLS ON GITHUB :) ↗</a>
      </footer>
    </main>

    <script type="module" src="/src/ui/converter.ts"></script>
  </body>
</html>
